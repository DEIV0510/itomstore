<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="canonical" href="https://itomstore.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ITOMSTORE" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="ITOMSTORE | Tecnología Apple y productos premium en Colombia" />

      property="og:description"
      content="iPhone, MacBook, iPad, Apple Watch, parlantes Bose y accesorios. Domicilios en Barranquilla, entregas en Valledupar y envíos a toda Colombia."
    />
    <meta property="og:url" content="https://itomstore.vercel.app/" />
    <meta property="og:image" content="https://itomstore.vercel.app/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ITOMSTORE — tu mundo Apple" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ITOMSTORE | Tecnología Apple y productos premium en Colombia" />

      name="twitter:description"
      content="iPhone, MacBook, iPad, Apple Watch, parlantes Bose y accesorios. Envíos a toda Colombia."

    <link rel="icon" type="image/png" sizes="512x512" href="/img/favicon-512.png" />
    <link rel="apple-touch-icon" href="/img/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/img/logo.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Store",
            "@id": "https://itomstore.vercel.app/#store",
            "name": "ITOMSTORE",
            "alternateName": "iTOM STORE",
            "slogan": "Tu mundo Apple",
            "description": "Tienda de tecnología y productos del ecosistema Apple. iPhone, MacBook, iPad, Apple Watch, parlantes Bose y accesorios.",
            "url": "https://itomstore.vercel.app/",
            "image": "https://itomstore.vercel.app/img/og.jpg",
            "logo": "https://itomstore.vercel.app/img/logo.png",
            "telephone": "+573022170654",
            "currenciesAccepted": "COP",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Barranquilla",
              "addressRegion": "Atlántico",
              "addressCountry": "CO"
            },
            "areaServed": [
              { "@type": "City", "name": "Barranquilla" },
              { "@type": "City", "name": "Valledupar" },
              { "@type": "Country", "name": "Colombia" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://itomstore.vercel.app/#website",
            "url": "https://itomstore.vercel.app/",
            "name": "ITOMSTORE",
            "inLanguage": "es-CO",
            "publisher": { "@id": "https://itomstore.vercel.app/#store" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://itomstore.vercel.app/catalogo?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
